<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dead Drop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0d0d0d;
            color: #c9d1d9;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 2rem;
            color: #58a6ff;
            margin-bottom: 8px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .subtitulo {
            color: #6e7681;
            font-size: 0.85rem;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        textarea {
            width: 100%;
            height: 160px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            padding: 16px;
            resize: none;
            outline: none;
            transition: border 0.2s;
        }

        textarea:focus { border-color: #58a6ff; }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            background-color: #238636;
            border: none;
            border-radius: 8px;
            color: white;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        button:hover { background-color: #2ea043; }

        #resultado {
            display: none;
            margin-top: 30px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 24px;
        }

        #resultado h2 {
            color: #3fb950;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }

        .codigo {
            font-size: 2rem;
            color: #58a6ff;
            letter-spacing: 8px;
            text-align: center;
            padding: 16px 0;
        }

        .aviso {
            color: #6e7681;
            font-size: 0.75rem;
            text-align: center;
            margin-top: 12px;
            letter-spacing: 1px;
        }

        #secao-leitura {
            margin-top: 50px;
            border-top: 1px solid #21262d;
            padding-top: 30px;
        }

        #secao-leitura h2 {
            color: #6e7681;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .input-linha {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            padding: 10px 16px;
            outline: none;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        input:focus { border-color: #58a6ff; }

        .btn-ler {
            width: auto;
            margin-top: 0;
            padding: 10px 20px;
            background-color: #1f6feb;
            letter-spacing: 1px;
        }

        .btn-ler:hover { background-color: #388bfd; }

        #conteudo-mensagem {
            display: none;
            margin-top: 16px;
            background-color: #0d1117;
            border: 1px solid #3fb950;
            border-radius: 8px;
            padding: 20px;
            color: #3fb950;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        #erro-leitura {
            color: #f85149;
            font-size: 0.85rem;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.4rem; }

            textarea { font-size: 0.85rem; }

            input[type="file"] {
                width: 100%;
                font-size: 0.75rem;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .input-linha {
                flex-direction: column;
            }

            .btn-ler {
                width: 100%;
                margin-top: 10px;
            }

            #conteudo-mensagem { font-size: 0.85rem; }

            .codigo { font-size: 1.4rem; letter-spacing: 4px; }
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Dead Drop</h1>
        <p class="subtitulo">// mensagem criptografada. autodestruição após leitura.</p>

        <textarea id="texto" placeholder="Escreva sua mensagem..."></textarea>

        <div style="margin-top: 12px;">
            <label style="color:#6e7681; font-size:0.8rem; letter-spacing:1px;">// ANEXAR ARQUIVO (opcional, máx 5MB)</label>
            <input type="file" id="arquivo" accept=".jpg,.jpeg,.png,.gif,.pdf,.txt"
                style="display:block; margin-top:8px; color:#c9d1d9; font-family:'Courier New',monospace; font-size:0.8rem;" />
        </div>

        <button onclick="criarMensagem()">Criar Dead Drop</button>

        <div id="resultado">
            <h2>// DEAD DROP CRIADO</h2>
            <div class="codigo" id="codigo-gerado"></div>
            <p class="aviso">compartilhe este código. a mensagem será destruída após a primeira leitura.</p>
        </div>

        <div id="secao-leitura">
            <h2>// RECUPERAR MENSAGEM</h2>
            <div class="input-linha">
                <input type="text" id="input-codigo" placeholder="XXXX-XXXX" maxlength="9" />
                <button class="btn-ler" onclick="lerMensagem()">Abrir</button>
            </div>
            <div id="erro-leitura"></div>
            <div id="conteudo-mensagem"></div>
            <div id="arquivo-mensagem" style="display:none; margin-top:12px;"></div>
            <div id="container-tempo" style="display:none; margin-top:8px;">
                <div style="background:#21262d; border-radius:4px; height:3px; width:100%;">
                    <div id="barra-tempo" style="background:#f85149; height:3px; width:0%; border-radius:4px;"></div>
                </div>
                <p style="color:#6e7681; font-size:0.7rem; margin-top:4px; letter-spacing:1px;">// mensagem será destruída ao fim do tempo</p>
            </div>
        </div>
    </div>

    <script>
        async function criarMensagem() {
            const texto = document.getElementById('texto').value.trim()
            const arquivo = document.getElementById('arquivo').files[0]

            if (!texto && !arquivo) {
                alert('Escreva uma mensagem ou anexe um arquivo')
                return
            }

            const formData = new FormData()
            if (texto) formData.append('conteudo', texto)
            if (arquivo) formData.append('arquivo', arquivo)

            const resposta = await fetch('/mensagem', {
                method: 'POST',
                body: formData
            })

            const dados = await resposta.json()
            document.getElementById('codigo-gerado').textContent = dados.codigo
            document.getElementById('resultado').style.display = 'block'
            document.getElementById('texto').value = ''
            document.getElementById('arquivo').value = ''
        }

        async function lerMensagem() {
            const codigo = document.getElementById('input-codigo').value.trim().toUpperCase()
            const erro = document.getElementById('erro-leitura')
            const conteudo = document.getElementById('conteudo-mensagem')

            erro.textContent = ''
            conteudo.style.display = 'none'
            conteudo.style.filter = 'none'

            if (!codigo) return

            const resposta = await fetch(`/mensagem/${codigo}`)
            const dados = await resposta.json()

            if (dados.erro) {
                erro.textContent = '// ' + dados.erro
                return
            }

            if (dados.conteudo) {
                conteudo.textContent = dados.conteudo
                conteudo.style.display = 'block'
            }

            const arquivoDiv = document.getElementById('arquivo-mensagem')
            arquivoDiv.innerHTML = ''
            arquivoDiv.style.display = 'none'

            if (dados.arquivo) {
                const ext = dados.arquivo_nome.split('.').pop().toLowerCase()
                if (['jpg','jpeg','png','gif'].includes(ext)) {
                    arquivoDiv.innerHTML = `
                        <p style="color:#6e7681; font-size:0.75rem; margin-bottom:8px;">// ARQUIVO ANEXADO</p>
                        <img src="/mensagem/arquivo/${dados.arquivo}" style="max-width:100%; border-radius:8px;" />
                    `
                } else {
                    arquivoDiv.innerHTML = `
                        <p style="color:#6e7681; font-size:0.75rem; margin-bottom:8px;">// ARQUIVO ANEXADO</p>
                        <a href="/mensagem/arquivo/${dados.arquivo}" target="_blank"
                            style="color:#58a6ff; font-family:'Courier New',monospace; font-size:0.9rem;">
                            📎 ${dados.arquivo_nome}
                        </a>
                    `
                }
                arquivoDiv.style.display = 'block'
            }

            const tempoTexto = dados.conteudo ? dados.conteudo.length * 1000 : 0
            const tempoArquivo = dados.arquivo ? 60000 : 0
            const tempoTotal = Math.max(tempoTexto, tempoArquivo, 10000)

            const barra = document.getElementById('barra-tempo')
            const container = document.getElementById('container-tempo')
            container.style.display = 'block'
            barra.style.transition = `width ${tempoTotal}ms linear`
            barra.style.width = '100%'

            setTimeout(() => { barra.style.width = '0%' }, 100)

            setTimeout(() => {
                if (dados.conteudo) {
                    conteudo.style.filter = 'blur(12px)'
                    conteudo.textContent = '// mensagem destruída'
                }
                arquivoDiv.innerHTML = '<p style="color:#f85149; font-size:0.8rem;">// arquivo destruído</p>'
                container.style.display = 'none'
                erro.textContent = `// exibida por ${Math.round(tempoTotal / 1000)} segundos`
            }, tempoTotal)
        }
        
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                const conteudo = document.getElementById('conteudo-mensagem')
                if (conteudo.style.display === 'block') {
                    conteudo.style.filter = 'blur(12px)'
                }
            } else {
                document.getElementById('conteudo-mensagem').style.filter = 'none'
            }
        })

    </script>
</body>
</html>
