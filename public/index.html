<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dead Drop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0d0d0d;
            color: #c9d1d9;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 2rem;
            color: #58a6ff;
            margin-bottom: 8px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .subtitulo {
            color: #6e7681;
            font-size: 0.85rem;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        textarea {
            width: 100%;
            height: 160px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            padding: 16px;
            resize: none;
            outline: none;
            transition: border 0.2s;
        }

        textarea:focus { border-color: #58a6ff; }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            background-color: #238636;
            border: none;
            border-radius: 8px;
            color: white;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        button:hover { background-color: #2ea043; }

        #resultado {
            display: none;
            margin-top: 30px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 24px;
        }

        #resultado h2 {
            color: #3fb950;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }

        .codigo {
            font-size: 2rem;
            color: #58a6ff;
            letter-spacing: 8px;
            text-align: center;
            padding: 16px 0;
        }

        .aviso {
            color: #6e7681;
            font-size: 0.75rem;
            text-align: center;
            margin-top: 12px;
            letter-spacing: 1px;
        }

        #secao-leitura {
            margin-top: 50px;
            border-top: 1px solid #21262d;
            padding-top: 30px;
        }

        #secao-leitura h2 {
            color: #6e7681;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .input-linha {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            padding: 10px 16px;
            outline: none;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        input:focus { border-color: #58a6ff; }

        .btn-ler {
            width: auto;
            margin-top: 0;
            padding: 10px 20px;
            background-color: #1f6feb;
            letter-spacing: 1px;
        }

        .btn-ler:hover { background-color: #388bfd; }

        #conteudo-mensagem {
            display: none;
            margin-top: 16px;
            background-color: #0d1117;
            border: 1px solid #3fb950;
            border-radius: 8px;
            padding: 20px;
            color: #3fb950;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        #erro-leitura {
            color: #f85149;
            font-size: 0.85rem;
            margin-top: 10px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dead Drop</h1>
        <p class="subtitulo">// mensagem criptografada. autodestruição após leitura.</p>

        <textarea id="texto" placeholder="Escreva sua mensagem secreta..."></textarea>
        <button onclick="criarMensagem()">Criar Dead Drop</button>

        <div id="resultado">
            <h2>// DEAD DROP CRIADO</h2>
            <div class="codigo" id="codigo-gerado"></div>
            <p class="aviso">compartilhe este código. a mensagem será destruída após a primeira leitura.</p>
        </div>

        <div id="secao-leitura">
            <h2>// RECUPERAR MENSAGEM</h2>
            <div class="input-linha">
                <input type="text" id="input-codigo" placeholder="XXXX-XXXX" maxlength="9" />
                <button class="btn-ler" onclick="lerMensagem()">Abrir</button>
            </div>
            <div id="erro-leitura"></div>
            <div id="conteudo-mensagem"></div>
        </div>
    </div>

    <script>
        async function criarMensagem() {
            const texto = document.getElementById('texto').value.trim()
            if (!texto) return

            const resposta = await fetch('/mensagem', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ conteudo: texto })
            })

            const dados = await resposta.json()

            document.getElementById('codigo-gerado').textContent = dados.codigo
            document.getElementById('resultado').style.display = 'block'
            document.getElementById('texto').value = ''
        }

        async function lerMensagem() {
            const codigo = document.getElementById('input-codigo').value.trim().toUpperCase()
            const erro = document.getElementById('erro-leitura')
            const conteudo = document.getElementById('conteudo-mensagem')

            erro.textContent = ''
            conteudo.style.display = 'none'

            if (!codigo) return

            const resposta = await fetch(`/mensagem/${codigo}`)
            const dados = await resposta.json()

            if (dados.erro) {
                erro.textContent = '// ' + dados.erro
                return
            }

            conteudo.textContent = dados.conteudo
            conteudo.style.display = 'block'
        }

        document.getElementById('input-codigo').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') lerMensagem()
        })
    </script>
</body>
</html>
